[project]
name = "scamshield-ml"
version = "0.1.0"
description = "ScamShield dataset utilities"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "pyyaml==6.0.3",
    "scikit-learn>=1.9.1",
]

[tool.uv]
package = false
exclude-newer = "2026-11-16T00:00:00Z"

[dependency-groups]
dev = [
    "pytest==9.2.0",
]
hf = [
    "accelerate>=1.10",
    "datasets>=4.0",
    "flash-linear-attention>=0.6.0",
    "peft>=0.18",
    "torch>=2.15.0",
    "transformers>=5.23.0",
    "trl>=0.25",
]
viz = [
    "matplotlib>=3.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
