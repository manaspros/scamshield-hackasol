base_model: google/gemma-3-1b-it
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
learning_rate: 2.0e-4
epochs: 3
batch_size: 8
max_seq_len: 1024  # matches on-device setMaxTokens(1024) in GemmaClassifier.kt
bf16: true
output_dir: out/lora
